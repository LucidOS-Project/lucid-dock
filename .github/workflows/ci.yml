name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # sway gives the tests a real layer-shell compositor with a headless
      # backend, so they run the anchored path rather than the unanchored
      # fallback -- which is the path that ships, and which differs from the
      # fallback by about 35 MiB of RAM.
      # libwayland-bin is wayland-scanner; the foreign-toplevel protocol XML is
      # vendored, so wayland-protocols is deliberately not needed.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libglib2.0-dev libwayland-dev libwayland-bin \
            meson ninja-build git ca-certificates \
            sway adwaita-icon-theme

      # Not packaged before Ubuntu 25.10, so 24.04 runners build it. Same
      # ~/.local prefix the README documents for a development host, and the
      # build script picks that up on its own.
      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gls
          cd /tmp/gls
          meson setup build --prefix="$HOME/.local" \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          meson compile -C build
          meson install -C build

      - name: Build (build_lucid_dock.sh)
        working-directory: macoswebproto
        run: ./build_lucid_dock.sh

      # The binaries stamp their own git rev and build time. If this prints
      # "unknown" the stamping has broken, which is how a stale binary gets
      # measured for an afternoon.
      - name: Report what was built
        working-directory: macoswebproto
        run: |
          ./lucid_dock_cpp --version
          ./lucid_dock_settings --version

      - name: Build (CMake)
        working-directory: macoswebproto
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/$(gcc -dumpmachine)/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build/ci
          cmake --build build/ci
          ./build/ci/lucid_dock_cpp --version

      # lucid-tokens has its own suite, including a 400-file fuzz asserting that
      # no input can make resolution fail. The dock depends on that invariant,
      # so it is checked here rather than assumed.
      - name: lucid-tokens tests
        working-directory: macoswebproto/third_party/lucid-tokens
        run: make check

      - name: Foreign-toplevel protocol tests
        working-directory: macoswebproto
        run: ./tests/run_toplevel_source_tests.sh

      # A dock runs for the whole session, so what it costs in RAM is a promise
      # in the same way 60 fps is. Budgets the dock's cost above an empty GTK4
      # window, so a GTK or Mesa upgrade does not fail this check.
      - name: Memory budget
        working-directory: macoswebproto
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          ./tests/check_memory_budget.sh

      # The composition, not the components. lucid-session supervising the real
      # dock under a real layer-shell compositor is the claim the LucidOS session
      # rests on, and neither repository's own suite tests it: lucid-session's
      # fixtures are shell scripts, and the dock has never been started by
      # anything but a person.
      #
      # lucid-session is private, so this needs a token with read access to it --
      # the default GITHUB_TOKEN is scoped to this repository alone. Without the
      # secret the step skips rather than failing, because a missing credential
      # is not a broken dock and should not look like one.
      - name: Supervised session (lucid-session + dock under sway)
        env:
          LUCID_SESSION_DEPLOY_KEY: ${{ secrets.LUCID_SESSION_DEPLOY_KEY }}
        working-directory: macoswebproto
        run: |
          if [ -z "$LUCID_SESSION_DEPLOY_KEY" ]; then
            echo "::notice::LUCID_SESSION_DEPLOY_KEY not set -- skipping the"\
                 "supervised session check. See 'Enabling the supervised session"\
                 "check' in the README."
            exit 0
          fi
          # A read-only deploy key rather than a personal access token: it can
          # read exactly one repository and nothing else in the account, so the
          # blast radius of this secret leaking is one private icon dock rather
          # than everything the owner can reach.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LUCID_SESSION_DEPLOY_KEY" > ~/.ssh/lucid_session
          chmod 600 ~/.ssh/lucid_session
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/lucid_session -o IdentitiesOnly=yes" \
            git clone --depth 1 \
              git@github.com:LucidOS-Project/lucid-session.git /tmp/lucid-session
          make -C /tmp/lucid-session

          export XDG_RUNTIME_DIR=/tmp/xdg-session
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # A start shorter than lucid-session's healthy_seconds is a failure by
          # definition, so the dock has to be left alone past it and then stopped
          # the way a session ends -- by the compositor going away, not a kill.
          cat > /tmp/sway.cfg <<EOF
          output HEADLESS-1 resolution 1280x720
          exec_always sh -c '(/tmp/lucid-session/lucid-session run $PWD/lucid_dock_cpp > /tmp/session.log 2>&1; echo "rc=\$?" >> /tmp/session.log) & sleep 16; swaymsg exit'
          EOF
          WLR_BACKENDS=headless WLR_RENDERER=pixman GSK_RENDERER=cairo \
            LUCID_DOCK_NO_INTRO=1 sway -c /tmp/sway.cfg
          cat /tmp/session.log

          # The dock must have taken the anchored path and an event-driven
          # toplevel source: falling back to proc here would mean the protocol
          # went missing, and it would still have "worked".
          grep -q "running-app detection: wlr" /tmp/session.log
          ! grep -q "does not implement wlr-layer-shell" /tmp/session.log
          # Ran long enough to count, and the supervisor said so in those words.
          grep -q "counts as a healthy start" /tmp/session.log
          grep -q "^rc=0$" /tmp/session.log
          # Nothing was quarantined: a passing run that had set the user's
          # configuration aside would be a failure wearing a success.
          if grep -q "was set aside" /tmp/session.log; then
            echo "the supervisor quarantined a layer on a healthy run"; exit 1
          fi

      # The .deb is the deliverable, so the packaging is built on every push
      # rather than the day of a release, which is the day it is least
      # convenient to discover that debian/rules has rotted.
      #
      # This runner is 24.04, where gtk4-layer-shell is not packaged -- the
      # step above built it into ~/.local -- so LUCID_DEV_LIBDIR is set and the
      # resulting .deb records no dependency on it. That artifact is not
      # publishable and the build says so out loud. What is being checked here
      # is debian/control, debian/rules and the install layout, all of which are
      # the same on the target.
      - name: Build the Debian package
        env:
          LUCID_DEV_LIBDIR: /home/runner/.local/lib/x86_64-linux-gnu
        run: |
          sudo apt-get install -y --no-install-recommends dpkg-dev debhelper
          export PKG_CONFIG_PATH="$HOME/.local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH"
          dpkg-buildpackage -us -uc -b -d
          deb=$(ls ../lucid-dock_*.deb)
          echo "built $deb"
          dpkg-deb -I "$deb"
          # The package must contain the installed names, not the build-tree
          # ones: a user types lucid-dock, and lucid-session-start resolves it
          # by that name.
          dpkg-deb -c "$deb" | grep -q ' ./usr/bin/lucid-dock$'
          dpkg-deb -c "$deb" | grep -q ' ./usr/bin/lucid-dock-settings$'
          dpkg-deb -c "$deb" | grep -q ' ./usr/share/applications/lucid-dock-settings.desktop$'
          # A RUNPATH into somebody's home directory is meaningless on a user's
          # machine, and Debian policy forbids one pointing outside the package.
          dpkg-deb -x "$deb" /tmp/debroot
          if objdump -x /tmp/debroot/usr/bin/lucid-dock | grep -E 'RUNPATH|RPATH'; then
            echo "the packaged binary carries an rpath"; exit 1
          fi
          # dpkg-buildpackage writes to the parent directory by design, and
          # upload-artifact refuses a path containing '..', so the results are
          # moved inside the workspace rather than reached for outside it.
          mkdir -p dist && mv ../lucid-dock_*.deb ../lucid-dock_*.buildinfo \
            ../lucid-dock_*.changes dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: lucid-dock-deb
          path: dist/
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            macoswebproto/build/ci/CMakeFiles/*.log
          if-no-files-found: ignore
